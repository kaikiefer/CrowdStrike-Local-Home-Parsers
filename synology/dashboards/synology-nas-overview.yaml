      | cidr(Auth.source, subnet=["0.0.0.0/0", "::/0"])
      | ioc:lookup(field=Auth.source, type="ip_address", confidenceThreshold="high", strict=true)
      | split(ioc)
      | sort(@timestamp, order=desc, limit=200)
      | table([@timestamp, observer.name, Auth.user, Auth.source, Auth.outcome, Auth.mapping, ioc.indicator, ioc.malicious_confidence, ioc.labels], limit=200)
    visualization: table
    x: 0

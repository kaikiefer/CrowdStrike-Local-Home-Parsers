                      | Auth.action := "authentication-first-factor" | Auth.outcome := "success" | Auth.mapping := "historical exact template";
                  message = /^User \[(?<Auth.user>[^\]]+)\] logged in from \[(?<Auth.source>[^\]]+)\]\.$/
                      | Auth.action := "login" | Auth.outcome := "success" | Auth.mapping := "historical exact template";
                  message = /^User \[(?<Auth.user>[^\]]+)\] from \[(?<Auth.source>[^\]]+)\] logged out(?: via \[(?<Auth.service>[^\]]+)\])?\.$/
                      | Auth.action := "logout" | Auth.outcome := "not-reported" | Auth.mapping := "historical exact template";

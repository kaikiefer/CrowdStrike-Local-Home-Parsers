      | ioc:lookup(field=Auth.source, type="ip_address", confidenceThreshold="high", strict=true)
      | Auth.outcome=failure
      | count(as=Failures)
    visualization: single-value
    x: 6
    y: 0
    width: 6
    height: 2
    start: 1d
    end: now
    options: {}
  ioc-details:
    title: Login IOC match details
    description: Reported client IP, account, outcome, confidence and intelligence labels; one row per indicator match. Current
      intelligence applied at search time.
    type: query
    queryString: |-
      #Vendor=synology #event.module=dsm
      | observer.name = ?nas
      | Auth.action := event.action
      | Auth.outcome := "not-reported"

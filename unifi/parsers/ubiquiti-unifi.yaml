  - fieldsHaveValues:
      '#Cps.version': 1.2.0
      '#ecs.version': 9.5.0
      Parser.version: 1.0.1
      '#Vendor': ubiquiti
      '#event.module': unifi
      Parser.status: parsed
      '#event.dataset': unifi.network
      observer.product: UniFi Network
      observer.name: gateway.example
      user.name: example-admin
      source.ip: 192.0.2.10
    outputEventIndex: 0
    fieldsNotPresent:
    - _payload
    - _cef
    - _eventTime
    - _configActor
    - _configSource
    - _hostIp
    - _hostMac
    - '@error'
